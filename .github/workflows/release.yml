name: Release

# A merge to main whose package.json version has no tag yet is a new version:
# the VSIX build and the changelog run in parallel, then both go into a
# GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    # 2026-10-03 dani · repo personal (pocharlies/): arc-k8s solo existe para pocharlies-org.
    # Público, así que no gasta minutos. Vuelve a arc-k8s si el repo pasa a pocharlies-org.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$version ya está publicada; nada que sacar." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'

  changelog:
    needs: version
    if: needs.version.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changelog from the merged pull requests and their commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog.sh "${{ needs.version.outputs.version }}" "$GITHUB_SHA" | cat -s > CHANGELOG-section.md
          cat CHANGELOG-section.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG-section.md

  publish:
    needs: [version, build, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v${{ needs.version.outputs.version }}"
          gh release create "$v" dist/*.vsix \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$v" --notes-file dist/CHANGELOG-section.md
